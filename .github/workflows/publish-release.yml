name: Publish release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      release-check: true
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 scripts/release.py version)
          tag="v$version"
          python3 scripts/release.py notes > "$RUNNER_TEMP/release-notes.md"
          if git rev-parse --verify "refs/tags/$tag" > /dev/null 2>&1; then
            test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA"
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists"
          else
            gh release create "$tag" --verify-tag --title "$tag" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
